<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./css-cyberpunk/acesso.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <title>Cyberpunk Edgerunners | Cadastro</title>
</head>

<body>

    
    <nav class="menu">
        <a class="logo" href="../index-cyberpunk.html">
            <img src="../Icons-cyberpunk/Logo neon Cyberpunk_ Edgerunners.png" alt="Cyberpunk Edgerunners">
        </a>

        <div class="menu-fundo"></div>

        <div class="menu-links">
            <a href="../index-cyberpunk.html">HOME</a>
            <a href="../index-cyberpunk.html#sobre">SOBRE</a>
            <a href="index-cyberpunk.html#mercenarios">MERCENÁRIOS</a>
            <a href="index-cyberpunk.html#night-city">NIGHT CITY</a>
            <a href="login.html">LOGIN</a>
            <a href="cadastro.html" class="botao-cadastro">CADASTRO</a>
        </div>
    </nav>

    <main class="acesso">
        <div class="acesso-card">
            <h1>CADASTRO</h1>
            <p class="acesso-subtitulo">Crie sua conta e entre em Night City.</p>

            <form>

                <div class="campo">
                    <label for="ipt_nome">Nome de usuário</label>
                    <input id="ipt_nome" type="text" placeholder="Seu nome de usuário">
                </div>

                <div class="campo">
                    <label for="ipt_email">E-mail</label>
                    <input id="ipt_email" type="text" placeholder="meuemail@provedor.com">
                </div>

                <div class="campo">
                    <label for="ipt_senha">Senha</label>
                    <input id="ipt_senha" type="password" placeholder="******">
                </div>

                <div class="campo">
                    <label for="ipt_confirmarSenha">Confirmar senha</label>
                    <input id="ipt_confirmarSenha" type="password" placeholder="******">
                </div>

                <div class="campo">
                    <label for="slc_personagem">Personagem favorito</label>
                    <!-- O value de cada option será o id do personagem no banco (etapa futura) -->
                    <select id="slc_personagem">
                        <option value="">Escolha seu personagem</option>
                        <option value="1">David Martinez</option>
                        <option value="2">Lucy</option>
                        <option value="3">Maine</option>
                        <option value="4">Rebecca</option>
                    </select>
                </div>

                <button type="button" class="botao-acesso" onclick="cadastrar()">CADASTRAR</button>
            </form>

            <div id="div_msg"></div>

            <p class="acesso-link">Já tem conta? <a href="login.html">Fazer login</a></p>
        </div>
    </main>

</body>

</html>

<script>
    function cadastrar() {
        let nome = ipt_nome.value.trim();
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;
        let confirmarSenha = ipt_confirmarSenha.value;
        let personagem = slc_personagem.value;

        let erros = [];

       

        // ---------- NOME ----------
        if (nome.length < 3 || nome.length > 50) {
            erros.push("O nome deve ter de 3 a 50 caracteres.");
        }

        // ---------- E-MAIL ----------
        let quantidadeArroba = 0;
        let temEspacoEmail = false;

        // FOR: conta quantos @ existem e procura espaços
        for (let i = 0; i < email.length; i++) {
            if (email[i] == "@") {
                quantidadeArroba++;
            }
            if (email[i] == " ") {
                temEspacoEmail = true;
            }
        }

        // indexOf = posição do primeiro @ | lastIndexOf = posição do último "."
        let posicaoArroba = email.indexOf("@");
        let posicaoPonto = email.lastIndexOf(".");

        if (quantidadeArroba != 1 || temEspacoEmail || email.length > 50 ||
            posicaoArroba < 1 ||
            posicaoPonto < posicaoArroba + 2 ||
            posicaoPonto > email.length - 2) {
            erros.push("Digite um e-mail válido (ex: nome@provedor.com).");
        }

        // ---------- SENHA ----------
        let temMaiuscula = false;
        let temMinuscula = false;
        let temNumero = false;
        let temSimbolo = false;
        let temEspacoSenha = false;

        for (let i = 0; i < senha.length; i++) {
            let caractere = senha[i];

            if (caractere == caractere.toUpperCase() && caractere != caractere.toLowerCase()) {
                temMaiuscula = true;

            }else if (caractere == caractere.toLowerCase() && caractere != caractere.toUpperCase()) {
                temMinuscula = true;

            }else if (caractere >= "0" && caractere <= "9") {
                
                temNumero = true;

            }else if (caractere == " "){

                temEspacoSenha = true;
            }else {
                temSimbolo = true;
            }
        }
          
        if (senha.length < 8 || senha.length > 50) {
            erros.push("A senha deve ter de 8 a 50 caracteres.");
        }
        if (!temMaiuscula) {
            erros.push("A senha deve ter uma letra maiúscula.");
        }
        if (!temMinuscula) {
            erros.push("A senha deve ter uma letra minúscula.");
        }
        if (!temNumero) {
            erros.push("A senha deve ter um número.");
        }
        if (!temSimbolo) {
            erros.push("A senha deve ter um símbolo (ex: ! @ # $ % &).");
        }
        if (temEspacoSenha) {
            erros.push("A senha não pode ter espaços.");
        }

        // ---------- CONFIRMAR SENHA ----------
        if (confirmarSenha != senha || senha == "") {
            erros.push("As senhas são diferentes.");
        }

        // ---------- PERSONAGEM ----------
        if (personagem == "") {
            erros.push("Escolha seu personagem favorito.");
        }

        // ---------- RESULTADO ----------
        if (erros.length == 0) {
            div_msg.className = "msg-sucesso";
            div_msg.innerHTML = "Cadastro válido!";

        }else {
          
            let texto = "";
            for (let i = 0; i < erros.length; i++) {
                texto += erros[i] + "<br>";
            }
            div_msg.className = "msg-erro";
            div_msg.innerHTML = texto;
        }
    }
</script>
