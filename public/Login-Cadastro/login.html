        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&display=swap"

    <title>Cyberpunk Edgerunners | Login</title>

<body>

    <!-- HEADER -->
    <nav class="menu">
        <a class="logo" href="../index-cyberpunk.html">
            <img src="../Icons-cyberpunk/Logo neon Cyberpunk_ Edgerunners.png" alt="Cyberpunk Edgerunners">

        <div class="menu-fundo"></div>

        <div class="menu-links">
            <a href="../index-cyberpunk.html">HOME</a>

        </div>

    <main class="acesso">
        <div class="acesso-card">
            <h1>LOGIN</h1>
            <p class="acesso-subtitulo">Bem-vindo de volta, edgerunner.</p>

            <form>

                <div class="campo">
                    <label for="ipt_email">E-mail</label>
                    <input id="ipt_email" type="text" placeholder="meuemail@provedor.com">
                </div>

                <div class="campo">
                    <label for="ipt_senha">Senha</label>
                    <input id="ipt_senha" type="password" placeholder="******">
                </div>

                <button type="button" class="botao-acesso" onclick="logar()">ENTRAR</button>
            </form>

            <div id="div_msg"></div>

            <p class="acesso-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </main>

</body>

</html>

<script>
    function logar() {
        let email = ipt_email.value.trim();
        let senha = ipt_senha.value;

        let erros = [];

        // ---------- E-MAIL ----------
        let quantidadeArroba = 0;
        let temEspaco = false;

        for (let i = 0; i < email.length; i++) {
            if (email[i] == "@") {
                quantidadeArroba++;
            }
            if (email[i] == " ") {
                temEspaco = true;
            }
        }

        let posicaoArroba = email.indexOf("@");
        let posicaoPonto = email.lastIndexOf(".");

        if (quantidadeArroba != 1 || temEspaco || email.length > 50 ||
            posicaoArroba < 1 ||
            posicaoPonto < posicaoArroba + 2 ||
            posicaoPonto > email.length - 2) {
            erros.push("Digite um e-mail válido.");
        }

        // ---------- SENHA ----------
        if (senha.length == 0) {
            erros.push("Digite sua senha.");
        }

        // ---------- RESULTADO ----------
        if (erros.length == 0) {
            div_msg.className = "msg-sucesso";
            // div_msg.innerHTML = "Login válido!"; // ANTES: só mostrava a mensagem, sem falar com o servidor
            enviarLogin(email, senha); // AGORA: manda e-mail e senha para a rota /usuarios/autenticar

        }   else {
        
            let texto = "";
            for (let i = 0; i < erros.length; i++) {
                texto += erros[i] + "<br>";
            }
            div_msg.className = "msg-erro";
            div_msg.innerHTML = texto;
        } 
    }

    // Envia e-mail e senha para a rota POST /usuarios/autenticar e trata a resposta do servidor.
    function enviarLogin(email, senha) {
        div_msg.className = "msg-sucesso";
        div_msg.innerHTML = "Entrando...";

        fetch("/usuarios/autenticar", { // fetch = envia/busca dados no servidor; este endereço é a rota (app.js + routes)
            method: "POST", // POST = estamos ENVIANDO dados
            headers: { "Content-Type": "application/json" }, // avisa ao servidor que o corpo está em formato JSON
            body: JSON.stringify({ // JSON.stringify transforma o objeto em texto para poder viajar até o servidor
                emailServer: email, // estes nomes precisam ser iguais aos lidos no controller (req.body.emailServer)
                senhaServer: senha
            })
        }).then(function (resposta) { // .then = quando o servidor responder, faça isso

            if (resposta.ok) { // ok = o servidor respondeu com sucesso (status 200)
                resposta.json().then(function (json) { // transforma a resposta em objeto para podermos usar json.nome, json.id...

                    // sessionStorage = "gaveta" do navegador onde o login fica salvo enquanto a aba estiver aberta
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.PERSONAGEM_USUARIO = json.personagemId;
                    sessionStorage.PERSONAGEM_NOME = json.personagemNome; // estes nomes (json.personagemNome...) vêm do res.json do controller
                    sessionStorage.PERSONAGEM_FRASE = json.personagemFrase;
                    sessionStorage.PERSONAGEM_DESCRICAO = json.personagemDescricao;
                    sessionStorage.PERSONAGEM_CLASSE = json.personagemClasse;

                    div_msg.className = "msg-sucesso";
                    div_msg.innerHTML = "Login realizado! Redirecionando...";

                    setTimeout(function () { // setTimeout = espera 1000 ms (1 segundo) antes de executar
                        window.location = "../Questionario/questionario.html"; // troca de página: vai para o questionário
                    }, 1000);
                });

            } else {
                resposta.text().then(function (texto) {
                    div_msg.className = "msg-erro";
                    if (resposta.status == 403) { // 403 = e-mail e/ou senha errados (mensagem vem do controller)
                        div_msg.innerHTML = texto;
                    } else {
                        div_msg.innerHTML = "Erro no servidor. Tente novamente em instantes.";
                    }
                });
            }

        }).catch(function (erro) { // .catch = roda se nem chegou a falar com o servidor (ex.: servidor desligado)
            console.log(erro);
            div_msg.className = "msg-erro";
            div_msg.innerHTML = "Não foi possível conectar ao servidor.";
        });
    }
</script>
